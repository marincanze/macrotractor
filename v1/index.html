<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1b1b1f">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Macrotractor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-48.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- ikone -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b3a7fb"/><stop offset="1" stop-color="#8c7cf2"/>
      </linearGradient>
      <linearGradient id="gProtein" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7fdcd0"/><stop offset="1" stop-color="#4fc1b4"/>
      </linearGradient>
      <linearGradient id="gCarbs" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f8cd7e"/><stop offset="1" stop-color="#eeb04f"/>
      </linearGradient>
      <linearGradient id="gFat" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f6a3b9"/><stop offset="1" stop-color="#ec7d9a"/>
      </linearGradient>
      <linearGradient id="gOver" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f59a92"/><stop offset="1" stop-color="#e86a6a"/>
      </linearGradient>
    </defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-barcode" viewBox="0 0 24 24"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-chef" viewBox="0 0 24 24"><path d="M7 14a4 4 0 1 1 1.5-7.7A4.5 4.5 0 0 1 16.5 6 4 4 0 1 1 17 14v6H7z"/><path d="M7 17h10"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.8 1.2 2.7 2 3 0-3-.5-5.5 1-8.5z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8.5 9.5a5 5 0 0 1 7 0L12 12z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">Macrotractor</div>
    <nav class="tabs" id="tabs">
      <button data-view="today" class="active"><svg><use href="#i-home"/></svg><span data-i18n="nav.today">Danes</span></button>
      <button data-view="stats"><svg><use href="#i-chart"/></svg><span data-i18n="nav.stats">Statistika</span></button>
      <button data-view="profile"><svg><use href="#i-user"/></svg><span data-i18n="nav.profile">Profil</span></button>
    </nav>
    <span class="sync-dot" id="syncDot" data-i18n-title="sync.ok"></span>
  </header>

  <main>
    <!-- ======================= DANES ======================= -->
    <section id="view-today" class="view active">
      <div class="hero-head">
        <div>
          <div class="eyebrow" id="greeting"></div>
          <div class="daybar">
            <button class="icon-btn" id="prevDay" data-i18n-aria="day.prev"><svg><use href="#i-left"/></svg></button>
            <h1 class="day-label" id="dayLabel"></h1>
            <button class="icon-btn" id="nextDay" data-i18n-aria="day.next"><svg><use href="#i-right"/></svg></button>
          </div>
        </div>
        <span class="goal-chip" id="goalChip"></span>
      </div>

      <div class="bento" id="dayCard">
        <div class="card hero">
          <div class="ring-wrap">
            <svg viewBox="0 0 200 200" class="ring">
              <circle cx="100" cy="100" r="86" class="ring-bg"/>
              <circle cx="100" cy="100" r="86" class="ring-fg" id="kcalRing" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
            </svg>
            <div class="ring-text">
              <div class="ring-num" id="kcalLeft">–</div>
              <div class="ring-sub" id="kcalLeftLabel"></div>
            </div>
          </div>
          <div class="hero-stats">
            <div><span class="lbl" data-i18n="eaten">Zaužito</span><b id="kcalEaten">0</b></div>
            <div><span class="lbl" data-i18n="target">Cilj</span><b id="kcalTarget">0</b></div>
          </div>
        </div>
        <div class="macro-cards" id="macroCards"></div>
        <div class="card details" id="detailCard"></div>
      </div>

      <div class="composer card">
        <form id="chatForm" class="chat-form" autocomplete="off">
          <svg class="chat-ico"><use href="#i-sparkle"/></svg>
          <input id="chatInput" data-i18n-ph="chat.placeholder" maxlength="2000" enterkeyhint="send">
          <button class="send-btn" type="submit" data-i18n-aria="chat.send"><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="add-actions">
          <label class="action">
            <span class="action-ico a1"><svg><use href="#i-camera"/></svg></span>
            <span data-i18n="add.photo"></span>
            <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
          </label>
          <label class="action">
            <span class="action-ico a2"><svg><use href="#i-barcode"/></svg></span>
            <span data-i18n="add.barcode"></span>
            <input type="file" accept="image/*" capture="environment" id="barcodeInput" hidden>
          </label>
          <button class="action" id="manualCodeBtn" type="button">
            <span class="action-ico a3"><svg><use href="#i-keyboard"/></svg></span>
            <span data-i18n="add.code"></span>
          </button>
          <button class="action" id="quickBtn" type="button">
            <span class="action-ico a4"><svg><use href="#i-bookmark"/></svg></span>
            <span data-i18n="add.quick"></span>
          </button>
        </div>
        <div id="pending"></div>
      </div>

      <button class="recipe-cta" id="recipeBtn">
        <span class="cta-ico"><svg><use href="#i-chef"/></svg></span>
        <span><b data-i18n="recipe.cta"></b><small data-i18n="recipe.ctaSub"></small></span>
        <svg class="cta-arrow"><use href="#i-right"/></svg>
      </button>

      <div id="meals"></div>
      <div class="card empty-card" id="entriesEmpty">
        <div class="empty-ico"><svg><use href="#i-sparkle"/></svg></div>
        <p><span data-i18n="entries.empty"></span><br><small data-i18n="entries.emptySub"></small></p>
      </div>
      <div class="card health-card" id="healthCard"></div>
    </section>

    <!-- ======================= STATISTIKA ======================= -->
    <section id="view-stats" class="view">
      <div class="hero-head">
        <div>
          <div class="eyebrow" data-i18n="stats.eyebrow"></div>
          <h1 class="day-label" data-i18n="stats.title"></h1>
        </div>
      </div>
      <div class="seg" id="rangeSeg">
        <button data-days="7" class="active"></button>
        <button data-days="30"></button>
        <button data-days="90"></button>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="card">
        <div class="card-head"><h3 data-i18n="stats.kcalPerDay"></h3><span class="legend-mini"><i class="dash"></i><span data-i18n="stats.target"></span></span></div>
        <div id="kcalChart" class="chart"></div>
      </div>
      <div class="card">
        <h3 data-i18n="stats.avgMacros"></h3>
        <div id="macroAvg"></div>
      </div>
      <div class="card">
        <h3 data-i18n="stats.weight"></h3>
        <form id="weightForm" class="inline-form">
          <input type="number" step="0.1" min="20" max="400" inputmode="decimal" id="weightInput" data-i18n-ph="stats.weightPh" required>
          <button class="btn primary" type="submit" data-i18n="save"></button>
        </form>
        <div id="weightChart" class="chart"></div>
      </div>
      <div class="card">
        <h3 data-i18n="stats.top"></h3>
        <ul class="toplist" id="topFoods"></ul>
      </div>
    </section>

    <!-- ======================= PROFIL ======================= -->
    <section id="view-profile" class="view">
      <div class="hero-head">
        <div>
          <div class="eyebrow" data-i18n="profile.eyebrow"></div>
          <h1 class="day-label" data-i18n="profile.title"></h1>
        </div>
      </div>

      <div class="card">
        <h3 data-i18n="profile.language"></h3>
        <div class="seg lang-seg" id="langSeg">
          <button type="button" data-lang="sl">🇸🇮 Slovenščina</button>
          <button type="button" data-lang="en">🇬🇧 English</button>
        </div>
      </div>

      <form id="profileForm" class="form">
        <div class="card">
          <h3 data-i18n="profile.personal"></h3>
          <div class="seg sex-seg" id="sexSeg">
            <button type="button" data-sex="male" data-i18n="profile.male"></button>
            <button type="button" data-sex="female" data-i18n="profile.female"></button>
          </div>
          <input type="hidden" name="sex">
          <div class="grid3">
            <label><span data-i18n="profile.age"></span><span class="unit-input"><input type="number" name="age" min="10" max="100" inputmode="numeric" required><em data-i18n="unit.years"></em></span></label>
            <label><span data-i18n="profile.height"></span><span class="unit-input"><input type="number" name="height_cm" min="100" max="250" inputmode="numeric" required><em>cm</em></span></label>
            <label><span data-i18n="profile.weight"></span><span class="unit-input"><input type="number" name="weight_kg" step="0.1" min="30" max="400" inputmode="decimal" required><em>kg</em></span></label>
          </div>
          <label><span data-i18n="profile.activity"></span>
            <select name="activity">
              <option value="1.2" data-i18n="act.1.2"></option>
              <option value="1.375" data-i18n="act.1.375"></option>
              <option value="1.55" data-i18n="act.1.55"></option>
              <option value="1.725" data-i18n="act.1.725"></option>
              <option value="1.9" data-i18n="act.1.9"></option>
            </select>
          </label>
        </div>

        <div class="card">
          <h3 data-i18n="profile.goal"></h3>
          <div class="goal-cards" id="goalSeg">
            <button type="button" data-goal="cut"><svg><use href="#i-flame"/></svg><b data-i18n="goal.cut"></b><small>cutting</small></button>
            <button type="button" data-goal="maintain"><svg><use href="#i-target"/></svg><b data-i18n="goal.maintain"></b><small>maintain</small></button>
            <button type="button" data-goal="bulk"><svg><use href="#i-bolt"/></svg><b data-i18n="goal.bulk"></b><small>bulking</small></button>
          </div>
          <input type="hidden" name="goal">
          <label id="rateLabel"><span data-i18n="profile.rate"></span>
            <select name="rate">
              <option value="0.25"></option>
              <option value="0.5"></option>
              <option value="0.75"></option>
              <option value="1"></option>
            </select>
          </label>
          <details>
            <summary data-i18n="profile.advanced"></summary>
            <div class="grid2">
              <label><span data-i18n="profile.protein"></span><span class="unit-input"><input type="number" name="protein_per_kg" step="0.1" min="0.8" max="3.5" inputmode="decimal"><em>g/kg</em></span></label>
              <label><span data-i18n="profile.fat"></span><span class="unit-input"><input type="number" name="fat_pct" min="15" max="50" inputmode="numeric"><em>% kcal</em></span></label>
            </div>
            <label><span data-i18n="profile.customKcal"></span><span class="unit-input"><input type="number" name="custom_kcal" min="800" max="8000" inputmode="numeric"><em>kcal</em></span></label>
          </details>
        </div>

        <div class="card calc" id="calcBox"></div>
        <button class="btn primary full big" type="submit" data-i18n="profile.save"></button>
      </form>

      <div class="card">
        <h3>Claude</h3>
        <div class="claude-status" id="claudeStatus"><span class="spinner"></span> <span data-i18n="claude.checking"></span></div>
        <p class="muted small" id="claudeInfo"><span data-i18n="claude.info"></span> <code>claude auth login</code></p>
      </div>

      <div class="card">
        <h3 data-i18n="sync.title"></h3>
        <p class="muted small" id="syncInfo" data-i18n="sync.info"></p>
        <p class="muted small" id="serverAddr"><span data-i18n="sync.address"></span> <code id="serverUrl"></code></p>
        <button class="btn ghost" id="logoutBtn" data-i18n="logout" hidden></button>
      </div>

      <div class="card app-info">
        <p class="muted small">Macrotractor · <span data-i18n="app.version"></span> <code id="appVersion"></code></p>
        <button class="btn soft" id="updateBtn" type="button" data-i18n="app.update"></button>
      </div>

      <div class="card">
        <h3 data-i18n="backup.title"></h3>
        <p class="muted small" data-i18n="backup.info"></p>
        <div class="backup-btns">
          <button class="btn soft" id="backupExport"><svg><use href="#i-download"/></svg> <span data-i18n="backup.export"></span></button>
          <label class="btn ghost" id="backupImportBtn"><svg><use href="#i-share"/></svg> <span data-i18n="backup.import"></span>
            <input type="file" id="backupImport" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
    </section>
  </main>

  <!-- ======================= MODALI ======================= -->
  <dialog id="recipeDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="recipe.title"></h3>
      <button class="icon-btn" data-i18n-aria="close"><svg><use href="#i-x"/></svg></button>
    </form>
    <div class="seg" id="recipeTabs">
      <button type="button" data-tab="new" class="active" data-i18n="recipe.tabNew"></button>
      <button type="button" data-tab="saved"><span data-i18n="recipe.tabSaved"></span> <span id="savedCount" class="count"></span></button>
    </div>
    <div id="recipeNew">
      <div id="recipeRemaining" class="macro-pills"></div>
      <form id="recipeForm" class="form">
        <div class="seg meal-seg" id="mealSeg">
          <button type="button" data-meal="" class="active" data-i18n="recipe.any"></button>
          <button type="button" data-meal="breakfast" data-i18n="recipe.breakfast"></button>
          <button type="button" data-meal="lunch" data-i18n="recipe.lunch"></button>
          <button type="button" data-meal="dinner" data-i18n="recipe.dinner"></button>
          <button type="button" data-meal="snack" data-i18n="recipe.snack"></button>
        </div>

        <div class="opt-label" data-i18n="recipe.howMuch"></div>
        <div class="chip-row" id="pctChips">
          <button type="button" class="chip active" data-pct="100" data-i18n="recipe.all"></button>
          <button type="button" class="chip" data-pct="75">75 %</button>
          <button type="button" class="chip" data-pct="50">50 %</button>
          <button type="button" class="chip" data-pct="33">⅓</button>
          <button type="button" class="chip" data-pct="25">25 %</button>
        </div>
        <div class="target-grid">
          <label class="t-k"><span>kcal</span><input type="number" inputmode="numeric" min="0" id="tKcal"></label>
          <label class="t-p"><span data-i18n="macro.protein"></span><input type="number" inputmode="numeric" min="0" id="tProtein"></label>
          <label class="t-c"><span data-i18n="macro.carbs"></span><input type="number" inputmode="numeric" min="0" id="tCarbs"></label>
          <label class="t-f"><span data-i18n="macro.fat"></span><input type="number" inputmode="numeric" min="0" id="tFat"></label>
        </div>

        <div class="opt-row">
          <div>
            <div class="opt-label" data-i18n="recipe.focus"></div>
            <div class="chip-row" id="focusChips">
              <button type="button" class="chip t-p" data-focus="protein" data-i18n="macro.protein"></button>
              <button type="button" class="chip t-c" data-focus="carbs" data-i18n="macro.carbs"></button>
              <button type="button" class="chip t-f" data-focus="fat" data-i18n="macro.fat"></button>
            </div>
          </div>
          <div>
            <div class="opt-label" data-i18n="recipe.servingsLabel"></div>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="−">−</button>
              <output id="servingsOut">1</output>
              <button type="button" data-step="1" aria-label="+">+</button>
            </div>
          </div>
        </div>

        <label><span data-i18n="recipe.prefs"></span>
          <input name="prefs" data-i18n-ph="recipe.prefsPh" enterkeyhint="go">
        </label>
        <button class="btn primary full" type="submit"><svg><use href="#i-sparkle"/></svg> <span data-i18n="recipe.go"></span></button>
      </form>
    </div>
    <div id="recipeSaved" hidden></div>
    <div id="recipeOut"></div>
  </dialog>

  <dialog id="quickDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="quick.title"></h3>
      <button class="icon-btn" data-i18n-aria="close"><svg><use href="#i-x"/></svg></button>
    </form>
    <div id="quickOut" class="quick"></div>
  </dialog>

  <dialog id="entryDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="entry.edit"></h3>
      <button class="icon-btn" data-i18n-aria="close"><svg><use href="#i-x"/></svg></button>
    </form>
    <div id="entryOut"></div>
  </dialog>

  <dialog id="barcodeDialog" class="dialog">
    <form method="dialog" class="dialog-head">
      <h3 data-i18n="product.title"></h3>
      <button class="icon-btn" data-i18n-aria="close"><svg><use href="#i-x"/></svg></button>
    </form>
    <form id="codeForm" class="inline-form">
      <input id="codeInput" inputmode="numeric" data-i18n-ph="product.code" enterkeyhint="search" required>
      <button class="btn soft" type="submit" data-i18n="product.search"></button>
    </form>
    <div id="productOut"></div>
  </dialog>

  <dialog id="loginDialog" class="dialog">
    <h3 data-i18n="login.title"></h3>
    <form id="loginForm" class="form">
      <label><span data-i18n="login.password"></span>
        <input type="password" id="loginPass" required autocomplete="current-password">
      </label>
      <button class="btn primary full" type="submit" data-i18n="login.go"></button>
      <p class="error" id="loginErr"></p>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="local.js"></script>
  <script src="app.js"></script>
</body>
</html>
